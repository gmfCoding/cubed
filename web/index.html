<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cubed web wasm</title>
  <style>
    :root {
      --bg0: #121a26;
      --bg1: #1d2a3d;
      --accent: #ffb84a;
      --ink: #edf3ff;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 20%, var(--bg1), var(--bg0));
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.3;
      backdrop-filter: blur(4px);
      z-index: 2;
      white-space: pre;
    }

    #game {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="hud">loading wasm...</div>
  <canvas id="game"></canvas>
  <script type="module" src="main.js"></script>
</body>
</html>
